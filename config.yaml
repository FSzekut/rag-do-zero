# ============================================================================
#  Configuração do assistente — este é o ÚNICO arquivo que você precisa editar.
#  Pode ser alterado direto pelo site do GitHub, sem instalar nada.
#  Ao salvar, a esteira confere tudo. Se houver erro, nada é publicado e o
#  site antigo continua no ar, com a mensagem dizendo o que corrigir.
# ============================================================================

assistente:
  nome: "Professor de Engenharia de Dados"
  descricao: "Tire dúvidas de engenharia de dados e IA, explicado passo a passo."
  logo: ""                 # ex.: "assets/logo.png". Vazio = sem logo.
  logo_altura_px: 64       # de 16 a 200

aparencia:
  cor_primaria: "#1f6feb"  # cor hexadecimal, sempre com # na frente
  cor_secundaria: "#0d1117"
  tema: escuro             # claro ou escuro

comportamento:
  papel: |
    Você é um professor de engenharia de dados e inteligência artificial.
    Explique como quem ensina: comece pelo conceito, depois dê um exemplo
    concreto. Prefira frases curtas. Quando não souber, diga que não sabe.
  publico: "Estudantes de pós-graduação, sem experiência prévia na área."
  proibicoes:
    - "Não invente números, fontes ou citações."
    - "Não responda sobre assuntos fora de dados e IA."
  mensagem_boas_vindas: "Olá! Sobre o que você quer conversar hoje?"

# Viram os botões clicáveis da tela. De 0 a 6.
perguntas_exemplo:
  - "O que é um data lake e quando ele é melhor que um banco relacional?"
  - "Qual a diferença entre ETL e ELT?"
  - "Como funciona um embedding, na prática?"

limites:
  tamanho_maximo_resposta: 800   # em tokens, de 100 a 4000
  mensagens_por_sessao: 20       # proteção de custo, de 1 a 200

# A ORDEM é a preferência: o primeiro é tentado primeiro.
# Provedor sem chave cadastrada nos Secrets do Space é ignorado.
provedores:
  - nome: openrouter
    modelo: "nvidia/nemotron-3-super-120b-a12b:free"
  - nome: anthropic
    modelo: "claude-opus-5"
  - nome: openai
    modelo: "gpt-6-sol"

# A base de consulta (parte 2): o assistente responde com base nos documentos da
# pasta documentos/. É opcional: sem este bloco inteiro, ele responde como na parte 1.
# Mudou o tamanho ou a sobreposição dos trechos? O próximo push reindexa tudo.
base_conhecimento:
  trechos_por_resposta: 4      # quantos trechos vão ao modelo, de 1 a 10
  tamanho_trecho: 150          # máximo de palavras por trecho, de 40 a 400
  sobreposicao_trecho: 15      # % repetido entre trechos vizinhos, de 0 a 30
  peso_palavras: 1.0           # peso da busca por palavras, de 0 a 5 (0 desliga)
  peso_sentido: 1.0            # peso da busca por sentido, de 0 a 5 (0 desliga)
  similaridade_minima: 0.30    # abaixo disto, trecho achado só por sentido é descartado
