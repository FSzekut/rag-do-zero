# O portão. Roda a cada push na main e em todo pull request.
#
# Quatro verificações, nesta ordem. Qualquer uma que falhar deixa o CI vermelho,
# e o deploy.yml (que espera este terminar) não publica nada.
#
# Nenhum secret é usado aqui, de propósito: um pull request de fora roda este
# arquivo e nunca deve ter acesso a chave nenhuma.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes (pytest)
        run: pytest

      - name: Validar o config.yaml
        run: python scripts/validar_config.py config.yaml

      - name: Varredura de segredos
        run: python scripts/varredura_segredos.py
